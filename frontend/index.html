<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EHR Media Intelligence</title>

  <!-- Quicksand: the same Google Font the Onye website uses. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind Play CDN (no build step). Pinned to an exact version so the page cannot change under us. -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    // Brand colours, taken from the Onye website's CSS and named once here,
    // so every part of the page uses them the same way.
    // Contrast notes (WCAG): "brand" passes 4.5:1 only on white or surface, so text on
    // tinted backgrounds uses "brand-dark" or "deep". "accent" (gold) is never used for
    // text. "field" is a darker border for inputs, so their edges reach 3:1.
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ["Quicksand", "system-ui", "sans-serif"] },
          colors: {
            brand: { DEFAULT: "#007F7A", dark: "#006963" },
            deep: "#0E4A47",
            accent: { DEFAULT: "#E5C86B", soft: "#FBF1CC" },
            surface: "#F7FAF9",
            card: "#FFFFFF",
            mint: "#E3F4F1",
            ink: "#123D3D",
            muted: "#587775",
            line: "#CFE4E1",
            field: "#6E918D",
            focus: "#008B84",
            // Our own colours for type badges and anomalies, chosen to sit with the palette.
            badge: {
              doc: "#E3F4F1", "doc-text": "#0E4A47",
              lab: "#FBF1CC", "lab-text": "#6B4E00",
              summary: "#E8ECF8", "summary-text": "#2F3F73",
            },
            critical: { DEFAULT: "#FDECEC", text: "#9B1C1C", border: "#E8A3A3" },
            warning: { DEFAULT: "#FFF4D6", text: "#7A4A00", border: "#E5C86B" },
          },
          boxShadow: {
            card: "0 8px 24px rgba(17, 58, 58, 0.04)",
            "card-hover": "0 12px 28px rgba(17, 58, 58, 0.10)",
            drawer: "0 30px 80px rgba(0, 0, 0, 0.25)",
            button: "0 12px 24px rgba(0, 127, 122, 0.23)",
          },
          borderRadius: { card: "18px", panel: "28px" },
        },
      },
    };
  </script>
  <style>
    /* One visible focus ring for every focusable element (same as the Onye site). */
    :focus-visible { outline: 2px solid #008B84; outline-offset: 3px; }
    /* Respect users who ask for less motion. */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
    }
  </style>
</head>

<body class="bg-surface text-ink font-sans antialiased">
  <a href="#search-input"
     class="sr-only focus:not-sr-only focus:absolute focus:left-4 focus:top-4 focus:z-50 focus:rounded-full focus:bg-card focus:px-4 focus:py-2 focus:font-bold">
    Skip to search
  </a>

  <!-- "inert" is added to header and main while the drawer is open, so Tab cannot leave the drawer. -->
  <header id="page-header" class="border-b border-line bg-card">
    <div class="mx-auto max-w-5xl px-4 py-5 sm:px-6">
      <p class="text-[11px] font-bold uppercase tracking-[0.12em] text-brand-dark">Clinician search</p>
      <h1 class="mt-1 text-2xl font-semibold tracking-tight sm:text-3xl">EHR Media Intelligence</h1>
      <p class="mt-2 text-sm font-medium text-muted">AI summaries are for information only. Not a clinical decision.</p>
    </div>
  </header>

  <main id="page-main" class="mx-auto max-w-5xl px-4 pb-16 pt-6 sm:px-6">
    <!-- Search and filters -->
    <form id="search-form" role="search" aria-label="Search patient records" class="rounded-panel border border-line bg-card p-4 shadow-card sm:p-6" novalidate>
      <label for="search-input" class="block text-sm font-bold">Search records</label>
      <div class="mt-2 flex gap-2">
        <input id="search-input" name="query" type="search" autocomplete="off"
               placeholder="e.g. patients with high blood sugar"
               class="w-full rounded-xl border border-field bg-card px-4 py-3 text-base text-ink placeholder:text-muted focus:border-focus focus:outline-none focus:ring-4 focus:ring-focus/10">
        <button type="submit"
                class="shrink-0 rounded-full bg-brand px-5 py-3 text-sm font-bold text-white shadow-button transition hover:bg-brand-dark active:scale-[0.97]">
          Search
        </button>
      </div>

      <fieldset class="mt-4 grid gap-3 sm:grid-cols-3">
        <legend class="sr-only">Filters</legend>
        <div>
          <label for="filter-type" class="block text-xs font-bold uppercase tracking-[0.08em] text-muted">Type</label>
          <select id="filter-type" class="mt-1 w-full rounded-xl border border-field bg-card px-3 py-2.5 text-sm focus:border-focus focus:outline-none focus:ring-4 focus:ring-focus/10">
            <option value="">All</option>
            <option value="DocumentReference">Documents</option>
            <option value="DiagnosticReport">Lab reports</option>
            <option value="Summary">AI summaries</option>
          </select>
        </div>
        <div>
          <label for="filter-from" class="block text-xs font-bold uppercase tracking-[0.08em] text-muted">Date from</label>
          <input id="filter-from" type="date" class="mt-1 w-full rounded-xl border border-field bg-card px-3 py-2 text-sm tabular-nums focus:border-focus focus:outline-none focus:ring-4 focus:ring-focus/10">
        </div>
        <div>
          <label for="filter-to" class="block text-xs font-bold uppercase tracking-[0.08em] text-muted">Date to</label>
          <input id="filter-to" type="date" class="mt-1 w-full rounded-xl border border-field bg-card px-3 py-2 text-sm tabular-nums focus:border-focus focus:outline-none focus:ring-4 focus:ring-focus/10">
        </div>
      </fieldset>
    </form>

    <!-- Results. aria-busy is true while a search is loading. -->
    <section id="results" aria-labelledby="results-heading" aria-busy="false" class="mt-6">
      <h2 id="results-heading" class="sr-only">Search results</h2>
      <!-- Screen readers announce this line ("5 results in 25 ms") when it changes,
           instead of reading every card aloud. -->
      <p id="results-status" aria-live="polite" class="min-h-[1.5rem] text-sm font-semibold text-muted tabular-nums"></p>
      <!-- app.js fills this area with the hint, skeletons, cards, empty or error state. -->
      <div id="results-body" class="mt-3"></div>
    </section>
  </main>

  <!-- Patient drawer. Hidden until a card is opened. -->
  <div id="drawer-root" class="fixed inset-0 z-40" hidden>
    <div id="drawer-backdrop" class="absolute inset-0 bg-deep/60 opacity-0 transition-opacity duration-200"></div>
    <aside id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title"
           class="absolute inset-y-0 right-0 flex w-full translate-x-full flex-col bg-surface shadow-drawer transition-transform duration-200 ease-out sm:max-w-xl sm:rounded-l-panel">
      <div class="flex items-start justify-between gap-4 border-b border-line bg-card px-5 py-4 sm:rounded-tl-panel">
        <div class="min-w-0">
          <p class="text-[11px] font-bold uppercase tracking-[0.12em] text-brand-dark">Patient</p>
          <!-- tabindex="-1" lets us move focus here when the drawer opens, so the name is read first. -->
          <h2 id="drawer-title" tabindex="-1" class="mt-1 truncate text-xl font-semibold tracking-tight">Patient</h2>
          <p id="drawer-mrn" class="text-sm font-medium text-muted tabular-nums"></p>
        </div>
        <button id="drawer-close" type="button" aria-label="Close patient details"
                class="grid h-10 w-10 shrink-0 place-items-center rounded-full border border-field text-2xl leading-none text-deep transition hover:bg-mint">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <!-- aria-busy is true while the patient record is loading. -->
      <div id="drawer-body" aria-busy="false" class="flex-1 overflow-y-auto px-5 py-5"></div>
    </aside>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
